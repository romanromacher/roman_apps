// ── Supabase helpers ──
async function sbGet(table, filter) {
  const url = `${SUPABASE_URL}/rest/v1/${table}?${filter}&limit=1&apikey=${SUPABASE_KEY}`;
  const r = await fetch(url, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }});
  const d = await r.json();
  return d[0] || null;
}
async function sbUpsert(table, data) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal,resolution=merge-duplicates'
    },
    body: JSON.stringify(data)
  });
  if (!r.ok) {
    const err = await r.text();
    console.error('Supabase error:', err);
  }
  return r.ok;
}

async function sbUpsertOn(table, onConflict, data) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${encodeURIComponent(onConflict)}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal,resolution=merge-duplicates'
    },
    body: JSON.stringify(data)
  });
  if (!r.ok) {
    const err = await r.text();
    console.error('Supabase upsert error:', table, err);
  }
  return r.ok;
}

// ── Sync ──
let syncTimer = null;
function showSync(type, msg) {
  const bar = document.getElementById('sync-bar');
  bar.className = `show ${type}`;
  bar.textContent = msg;
  clearTimeout(syncTimer);
  if (type === 'saved') syncTimer = setTimeout(() => bar.classList.remove('show'), 2000);
}

async function loadData() {
  showSync('saving', 'Lädt...');
  try {
    const settings = await sbGet('fp_settings', `user_id=eq.${USER_ID}`);
    if (settings) {
      state.ziel = settings.ziel;
      state.steuersatz = settings.steuersatz;
      if (settings.kosten_betrieb?.length) state.kostenBetrieb = settings.kosten_betrieb;
      if (settings.kosten_privat?.length) state.kostenPrivat = settings.kosten_privat;
    }
    // Load all months
    const r = await fetch(`${SUPABASE_URL}/rest/v1/fp_month_data?user_id=eq.${USER_ID}&year=eq.${NOW_YEAR}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
    });
    const months = await r.json();
    months.forEach(m => { state.monthData[m.month] = { month: m.month, jobs: m.jobs || [] }; });
    state.loaded = true;
    showSync('saved', 'Gespeichert ✓');
  } catch(e) {
    showSync('error', 'Verbindungsfehler');
  }
  render();
}

function scheduleSave() { saveData(); }

async function saveData() {
  try {
    await sbUpsertOn('fp_settings', 'user_id', {
      user_id: USER_ID, ziel: state.ziel, steuersatz: state.steuersatz,
      kosten_betrieb: state.kostenBetrieb, kosten_privat: state.kostenPrivat, updated_at: new Date().toISOString()
    });
    const m = state.monthData[state.selectedMonth];
    await sbUpsertOn('fp_month_data', 'user_id,year,month', {
      user_id: USER_ID, year: NOW_YEAR, month: state.selectedMonth, jobs: m.jobs, updated_at: new Date().toISOString()
    });
    showSync('saved', 'Gespeichert ✓');
  } catch(e) { showSync('error', 'Fehler beim Speichern'); }
}

// ── Helpers ──
const fmt = n => n.toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fmtK = n => { if (n===0) return '0 €'; if (Math.abs(n)>=1000) return (n/1000).toLocaleString('de-DE',{maximumFractionDigits:1})+'k'; return n.toLocaleString('de-DE',{maximumFractionDigits:0})+' €'; };
const pct = (v,t) => t===0 ? 0 : Math.min(100, v/t*100);
const h = (tag, attrs, ...children) => {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') el.className = v;
    else el.setAttribute(k, v);
  });
  children.flat().forEach(c => { if (c == null) return; el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
};

function calcMonth(jobs, kb, kp, st) {
  const bestNetto = jobs.filter(j=>j.status==='bestaetigt').reduce((s,j)=>s+j.betrag,0);
  const offenNetto = jobs.filter(j=>j.status!=='bestaetigt').reduce((s,j)=>s+j.betrag,0);
  const totalKosten = [...kb,...kp].reduce((s,i)=>s+i.betrag,0);
  const steuer = bestNetto*(st/100);
  const prodK = jobs.filter(j=>j.status==='bestaetigt').reduce((s,j)=>s+(j.prodKosten||0),0);
  const marge = bestNetto - prodK;
  const nachAllem = marge - steuer - totalKosten;
  const mwst = bestNetto*0.19;
  return { bestNetto, offenNetto, totalKosten, steuer, nachAllem, mwst, brutto: bestNetto+mwst, prodK, marge };
}

function renderDashboard(cur, currentJobs, ziel, steuersatz, pc, zielErreicht, allCalc) {

  // 4er grid

    )

  // MwSt box

    h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:'8px' }},
      h('div', { style:{ fontSize:'11px', color:'#444', display:'flex', gap:'6px', flexWrap:'wrap', alignItems:'center' }},
        h('span', {}, `${fmtK(cur.bestNetto)} netto`),

        h('div', { style:{ fontSize:'9px', color:'#333', textTransform:'uppercase', marginBottom:'2px' }}, 'Abzuführen'),
        h('div', { style:{ fontFamily:'Syne,sans-serif', fontWeight:'800', fontSize:'16px', color:'#A78BFA' }}, fmtK(cur.mwst))
      )

    h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center' }},

  const prodBox = cur.prodK > 0 ? h('div', { style:{ background:'#0f0f0f', border:'1px solid #F8717118', borderRadius:'10px', overflow:'hidden' }},

      { label:'Gesamtumsatz (netto)', val:cur.bestNetto, color:'#aaa' },

    ].map(row => h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 14px', borderBottom:'1px solid #161616', background: row.bg||'transparent' }},

    )
  ) : null;

  // Steuer slider
  const steuerBox = h('div', { style:{ background:'#0f0f0f', border:'1px solid #1a1a1a', borderRadius:'10px', padding:'14px' }},
    h('div', { style:{ display:'flex', justifyContent:'space-between', marginBottom:'8px' }},
      h('div', {},
        h('div', { style:{ fontSize:'12px', color:'#bbb' }}, 'Steuerlast'),
        h('div', { style:{ fontSize:'10px', color:'#333' }}, 'Einkommensteuer-Schätzung')
      ),
      h('div', { style:{ fontFamily:'Syne,sans-serif', fontWeight:'800', fontSize:'16px', color:'#F87171' }}, `${state.steuersatz}%`)
    ),
    h('input', { type:'range', min:'15', max:'45', step:'1', value: state.steuersatz, style:{ width:'100%', accentColor:'#F87171', cursor:'pointer' },
      onInput: e => { state.steuersatz = Number(e.target.value); saveData(); render(); }
    })
  );

  wrap.append(grid, mwstBox, ergebnis);
  if (prodBox) wrap.append(prodBox);
  if (wwwBox) wrap.append(wwwBox);
  wrap.append(steuerBox);
  return wrap;
}

function renderJobs(currentJobs, cur, selectedMonth) {
  const wrap = h('div', { style:{ display:'flex', flexDirection:'column', gap:'8px' }});
  wrap.append(h('div', { style:{ fontSize:'11px', color:'#3a3a3a', marginBottom:'2px' }},
    currentJobs.length === 0 ? `Noch keine Jobs im ${MONATE_LANG[selectedMonth]}` : `${currentJobs.length} Jobs · ${fmt(cur.bestNetto)} bestätigt · ${fmt(cur.offenNetto)} offen`
  ));

  currentJobs.forEach(job => {
    const statusColor = job.status==='bestaetigt'?'#4ADE80':job.status==='offen'?'#FB923C':'#60A5FA';
    const card = h('div', { style:{ background:'#0f0f0f', border:`1px solid ${statusColor}15`, borderRadius:'10px', padding:'10px 12px' }});
    const row1 = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 95px 105px 26px', gap:'6px', alignItems:'center', marginBottom:'4px' }});

    const nameIn = h('input', { value: job.name, style:{ background:'transparent', border:'none', outline:'none', color:'#ddd', fontSize:'13px', minWidth:'0' }});
    nameIn.addEventListener('input', e => { job.name = e.target.value; saveData(); });

    const betragIn = h('input', { type:'number', value: job.betrag, style:{ background:'#161616', border:'1px solid #222', borderRadius:'5px', padding:'3px 5px', color:'#fff', fontSize:'12px', width:'100%', textAlign:'right', outline:'none' }});
    betragIn.addEventListener('input', e => { job.betrag = parseFloat(e.target.value)||0; saveData(); render(); });

    const statusSel = h('select', { style:{ background:'#161616', border:'1px solid #222', borderRadius:'5px', padding:'4px', fontSize:'10px', fontFamily:'Syne,sans-serif', fontWeight:'700', cursor:'pointer', outline:'none', color:statusColor }},
      h('option', { value:'bestaetigt' }, '✓ Bestätigt'),
      h('option', { value:'offen' }, '◌ Offen'),
      h('option', { value:'anfrage' }, '? Anfrage')
    );
    statusSel.value = job.status;
    statusSel.addEventListener('change', e => { job.status = e.target.value; saveData(); render(); });

    const delBtn = h('button', { style:{ background:'none', border:'none', cursor:'pointer', color:'#333', fontSize:'16px' }}, '×');
    delBtn.addEventListener('click', () => { state.monthData[selectedMonth].jobs = state.monthData[selectedMonth].jobs.filter(j=>j.id!==job.id); saveData(); render(); });

    row1.append(nameIn, h('div', { style:{ display:'flex', alignItems:'center', gap:'3px' }}, betragIn, h('span', { style:{ color:'#444', fontSize:'10px' }}, '€')), statusSel, delBtn);

    // Produktionskosten
    const prodRow = h('div', { style:{ display:'flex', alignItems:'center', gap:'6px', paddingTop:'6px', borderTop:'1px solid #1a1a1a' }});
    const prodIn = h('input', { type:'number', value: job.prodKosten||'', placeholder:'Produktionskosten €', style:{ background:'#161616', border:'1px solid #1e1e1e', borderRadius:'5px', padding:'2px 6px', color:'#F87171', fontSize:'11px', width:'100px', textAlign:'right', outline:'none' }});
    prodIn.addEventListener('input', e => { job.prodKosten = parseFloat(e.target.value)||0; saveData(); render(); });
    prodRow.append(h('span', { style:{ fontSize:'10px', color:'#383838' }}, 'Prod.kosten:'), prodIn, h('span', { style:{ fontSize:'10px', color:'#383838' }}, '€'));
    if ((job.prodKosten||0) > 0) prodRow.append(h('span', { style:{ fontSize:'10px', color:'#444', marginLeft:'auto' }}, 'Marge: ', h('span', { style:{ color:'#4ADE80', fontFamily:'Syne,sans-serif', fontWeight:'700' }}, fmt(job.betrag-(job.prodKosten||0)))));

    card.append(row1, prodRow);
    wrap.append(card);
  });

  // Neuer Job
  const newCard = h('div', { style:{ background:'#0d0d0d', border:'1px dashed #222', borderRadius:'10px', padding:'12px' }});
  newCard.append(h('div', { style:{ fontSize:'9px', textTransform:'uppercase', letterSpacing:'0.1em', color:'#333', marginBottom:'8px' }}, `+ Job eintragen für ${MONATE_LANG[selectedMonth]}`));
  const nameIn = h('input', { placeholder:'Projektname / Kunde', style:{ background:'#161616', border:'1px solid #222', borderRadius:'6px', padding:'8px 10px', color:'#ccc', fontSize:'13px', outline:'none', width:'100%', marginBottom:'8px' }});
  const row2 = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px', marginBottom:'8px' }});
  const betragIn = h('input', { type:'number', placeholder:'Umsatz netto €', style:{ background:'#161616', border:'1px solid #222', borderRadius:'6px', padding:'8px 10px', color:'#ccc', fontSize:'13px', outline:'none', width:'100%' }});
  const prodIn = h('input', { type:'number', placeholder:'Produktionskosten € (optional)', style:{ background:'#161616', border:'1px solid #1e1e1e', borderRadius:'6px', padding:'8px 10px', color:'#F87171', fontSize:'13px', outline:'none', width:'100%' }});
  const row3 = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 52px', gap:'8px' }});
  const statusSel = h('select', { style:{ background:'#161616', border:'1px solid #222', borderRadius:'6px', padding:'8px 5px', color:'#ccc', fontSize:'10px', fontFamily:'Syne,sans-serif', outline:'none', cursor:'pointer' }},
    h('option', { value:'bestaetigt' }, '✓ Bestätigt'),
    h('option', { value:'offen' }, '◌ Offen'),
    h('option', { value:'anfrage' }, '? Anfrage')
  );
  const addBtn = h('button', { style:{ background:'#F0E040', border:'none', borderRadius:'6px', cursor:'pointer', color:'#000', fontFamily:'Syne,sans-serif', fontWeight:'800', fontSize:'13px' }}, '+');
  addBtn.addEventListener('click', () => {
    if (!nameIn.value.trim()) return;
    state.monthData[selectedMonth].jobs.push({ id: Date.now(), name: nameIn.value.trim(), betrag: parseFloat(betragIn.value)||0, prodKosten: parseFloat(prodIn.value)||0, status: statusSel.value });
    saveData(); render();
  });
  row2.append(betragIn, prodIn);
  row3.append(statusSel, addBtn);
  newCard.append(nameIn, row2, row3);
  wrap.append(newCard);
  return wrap;
}

function renderKosten(kb, kp) {
  const wrap = h('div', { style:{ display:'flex', flexDirection:'column', gap:'14px' }});

  const totalAll = [...kb,...kp].reduce((s,i)=>s+i.betrag,0);
  wrap.append(h('div', { style:{ background:'#0f0f0f', border:'1px solid #1a1a1a', borderRadius:'10px', padding:'12px 14px' }},
    h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center' }},
      h('div', {},
        h('div', { style:{ fontSize:'9px', textTransform:'uppercase', letterSpacing:'0.1em', color:'#444' }}, 'Fixkosten gesamt / Monat'),
        h('div', { style:{ fontSize:'10px', color:'#2e2e2e', marginTop:'2px' }}, 'Gilt automatisch für alle Monate')
      ),
      h('span', { style:{ fontFamily:'Syne,sans-serif', fontWeight:'800', fontSize:'16px', color:'#60A5FA' }}, fmt(totalAll))
    )
  ));

  wrap.append(makeKostenBlock('Betriebliche Kosten', kb, '#60A5FA', items => { state.kostenBetrieb = items; saveData(); render(); }));

  // MwSt summary
  const totalB = kb.reduce((s,i)=>s+i.betrag,0);
  const mwstB = totalB - totalB/1.19;
  wrap.append(h('div', { style:{ background:'#0a0a0a', border:'1px solid #60A5FA15', borderRadius:'10px', padding:'12px 14px' }},
    h('div', { style:{ fontSize:'9px', textTransform:'uppercase', letterSpacing:'0.1em', color:'#444', marginBottom:'8px' }}, 'Vorsteuer betriebliche Kosten (19%)'),
    ...[
      { label:'Brutto (was du zahlst)', val:fmt(totalB), color:'#aaa' },
      { label:'Netto', val:fmt(totalB/1.19), color:'#555' },
      { label:'MwSt. / Vorsteuer', val:fmt(mwstB), color:'#60A5FA' },
    ].map(row => h('div', { style:{ display:'flex', justifyContent:'space-between', marginBottom:'5px' }},
      h('span', { style:{ fontSize:'11px', color:'#444' }}, row.label),
      h('span', { style:{ fontFamily:'Syne,sans-serif', fontWeight:'700', fontSize:'13px', color:row.color }}, row.val)
    )),
    h('div', { style:{ marginTop:'8px', paddingTop:'8px', borderTop:'1px solid #1a1a1a', fontSize:'10px', color:'#333' }}, `Diese ${fmt(mwstB)} kannst du als Vorsteuer zurückfordern.`)
  ));

  wrap.append(makeKostenBlock('Private Lebenshaltung', kp, '#A78BFA', items => { state.kostenPrivat = items; saveData(); render(); }));
  return wrap;
}

function makeKostenBlock(titel, items, accent, onChange) {
  const block = h('div', { style:{ background:'#0f0f0f', border:`1px solid ${accent}1a`, borderRadius:'10px' }});
  const total = items.reduce((s,i)=>s+i.betrag,0);
  block.append(h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'12px 16px', borderBottom:`1px solid ${accent}18` }},
    h('span', { style:{ fontFamily:'Syne,sans-serif', fontWeight:'700', fontSize:'11px', letterSpacing:'0.12em', textTransform:'uppercase', color:accent }}, titel),
    h('span', { style:{ fontFamily:'Syne,sans-serif', fontWeight:'800', fontSize:'14px', color:accent }}, `${fmt(total)}/Mo`)
  ));
  items.forEach(item => {
    const row = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 80px 28px', gap:'6px', padding:'6px 14px', borderBottom:'1px solid #161616', alignItems:'center' }});
    const nameIn = h('input', { value: item.name, style:{ background:'transparent', border:'none', outline:'none', color:'#bbb', fontSize:'12px', width:'100%' }});
    nameIn.addEventListener('input', e => { item.name = e.target.value; onChange([...items]); });
    const betragIn = h('input', { type:'number', value: item.betrag, style:{ background:'#1a1a1a', border:'1px solid #252525', borderRadius:'5px', padding:'3px 6px', color:'#fff', fontSize:'12px', width:'100%', textAlign:'right', outline:'none' }});
    betragIn.addEventListener('input', e => { item.betrag = parseFloat(e.target.value)||0; onChange([...items]); });
    const del = h('button', { style:{ background:'none', border:'none', cursor:'pointer', color:'#333', fontSize:'15px' }}, '×');
    del.addEventListener('click', () => onChange(items.filter(i=>i.id!==item.id)));
    row.append(nameIn, betragIn, del);
    block.append(row);
  });
  // Neue Zeile
  const addRow = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 80px 28px', gap:'6px', padding:'8px 14px', alignItems:'center' }});
  const newName = h('input', { placeholder:'+ Neue Position', style:{ background:'#161616', border:'1px dashed #252525', borderRadius:'5px', padding:'4px 8px', color:'#666', fontSize:'11px', outline:'none' }});
  const newBetrag = h('input', { type:'number', placeholder:'0', style:{ background:'#161616', border:'1px dashed #252525', borderRadius:'5px', padding:'4px 6px', color:'#666', fontSize:'11px', textAlign:'right', outline:'none' }});
  const addBtn = h('button', { style:{ background:accent, border:'none', borderRadius:'5px', cursor:'pointer', color:'#000', fontWeight:'800', fontSize:'14px', width:'28px', height:'28px', padding:'0' }}, '+');
  addBtn.addEventListener('click', () => {
    if (!newName.value.trim()) return;
    onChange([...items, { id: Date.now(), name: newName.value.trim(), betrag: parseFloat(newBetrag.value)||0 }]);
    newName.value = ''; newBetrag.value = '';
  });
  addRow.append(newName, newBetrag, addBtn);
  block.append(addRow);
  return block;
}

async function loadMonthIfNeeded() {
  const m = state.selectedMonth;
  if (state.monthData[m].loaded) return;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/fp_month_data?user_id=eq.${USER_ID}&year=eq.${NOW_YEAR}&month=eq.${m}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
    });
    const d = await r.json();
    if (d[0]) state.monthData[m] = { month: m, jobs: d[0].jobs||[], loaded: true };
    else state.monthData[m].loaded = true;
    render();
  } catch(e) {}
}

// ── Init ──
loadData();
</script>
